services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/data/shortener.db
      - BASE_URL=http://localhost:8000
      - LOG_LEVEL=INFO
    volumes:
      - db_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  db_data:
