services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATABASE_PATH=/app/data/urls.db
      - BASE_URL=http://localhost:8000
      - LOG_LEVEL=INFO
    volumes:
      - url-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  test:
    build: .
    command: pytest tests/ -v --tb=short
    environment:
      - DATABASE_PATH=:memory:
    depends_on:
      - app

volumes:
  url-data:
