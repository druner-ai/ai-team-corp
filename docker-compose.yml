services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/shortener.db
      BASE_URL: http://localhost:8000
      CACHE_TTL_SECONDS: 300
      SHORT_CODE_LENGTH: 6
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
