services:
  url-shortener:
    build: .
    container_name: url-shortener
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/data/urls.db
      - BASE_URL=http://localhost:8000
      - SHORT_CODE_LENGTH=6
      - MAX_URL_LENGTH=2048
    volumes:
      - url_shortener_data:/data
    restart: unless-stopped

volumes:
  url_shortener_data:
