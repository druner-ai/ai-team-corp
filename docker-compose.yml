services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/urls.db
      - BASE_URL=http://localhost:8000
      - CODE_LENGTH=6
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  test:
    build: .
    command: pytest tests/ -v
    environment:
      - DB_PATH=:memory:
