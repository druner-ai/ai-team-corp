# QA Fixes:
# 1. Removed unused get_db function that raised NotImplementedError (src/database.py).
# 2. Added extra safety check for request.client.host in redirect router (src/routers/redirect.py).
# 3. Replaced RuntimeError with HTTPException in url_service (src/services/url_service.py).
# 4. Added exception handling in routers to ensure connection release (src/routers/shorten.py, redirect.py, stats.py).

[project]
name = "url-shortener"
version = "0.1.0"
description = "A simple URL shortener service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
