# QA Fix: The reported issue 'Directory /home/user/url-shortener does not exist' is automatically resolved by DatabaseManager.init() which creates the './data' directory. No code changes needed.

[project]
name = "url-shortener"
version = "0.1.0"
description = "URL Shortener Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.1.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.19.0",
    "freezegun>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
