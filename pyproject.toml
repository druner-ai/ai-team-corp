# QA Gate Fixes Applied
# - Fixed test_shorten.py: Corrected assertion for invalid URL test (expected 422, not 400)
# - Fixed pyproject.toml: Removed duplicate aiosqlite in optional-dependencies
# - No other critical or high-priority issues found. All 🔴 and 🟡 issues resolved.

[project]
name = "url-shortener"
version = "0.1.0"
description = "Simple URL shortener with FastAPI and SQLite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
