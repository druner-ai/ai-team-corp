[project]
name = "url-shortener"
version = "1.0.0"
description = "A simple URL shortener service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "aiosqlite==0.20.0",
    "pydantic-settings==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.4",
    "httpx==0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
