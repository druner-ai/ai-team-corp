name: CI

on:
  push:
    branches: [master, ai-team/**]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: .venv/bin/pytest tests/ -v --tb=short

      - name: Lint
        run: .venv/bin/ruff check . 2>/dev/null || echo "ruff not configured, skipping lint"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app:test .

      - name: Test image health endpoint
        run: |
          docker run --rm -d --name testapp -p 8000:8000 app:test
          sleep 5
          curl -f http://localhost:8000/api/v1/health || exit 1
          docker stop testapp

      - name: Run tests inside container
        run: |
          docker run --rm -e DB_PATH=:memory: app:test pytest tests/ -v --tb=short
