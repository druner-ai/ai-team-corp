name: CI — Test & Lint

on:
  push:
    branches: [master, 'ai-team/**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            uv pip install --system -r requirements.txt
          elif [ -f pyproject.toml ]; then
            uv sync --no-dev
          fi
          uv pip install --system pytest pytest-asyncio pytest-cov

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Lint
        run: ruff check --select=E,F,I,N --ignore=E501 .

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t ai-team-app .
            echo "✅ Docker build OK"
          else
            echo "⚠️ No Dockerfile — skipping"
          fi
